<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>posts // 耽翫</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="pictures/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="pictures/favicon/favicon.ico" sizes="32x32" />
  <link rel="icon" href="pictures/favicon/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="pictures/favicon/apple-touch-icon.png" />
</head>
<body>

  <nav id="nav"></nav>

  <main>
    <h1>posts</h1>
    <p class="page-subtitle">// all writing, sorted by date</p>

    <div class="filter-bar" id="filter-bar"></div>

    <ul class="post-list" id="post-list"></ul>
  </main>

  <!--
    posts.js is auto-generated by build.py — do not edit it manually.
    To publish a new post:
      1. Create an HTML file in posts/ using an existing post as a template.
      2. Set these three <meta> tags in its <head>:
           <meta name="post-title"    content="Your Title">
           <meta name="post-date"     content="YYYY-MM-DD">
           <meta name="post-category" content="category">
      3. Run: python build.py
  -->
  <script src="posts.js"></script>
  <script>
    const list = document.getElementById('post-list');

    function renderPosts(posts) {
      list.innerHTML = '';
      posts.forEach(post => {
        const li = document.createElement('li');
        li.className = 'post-item';
        li.dataset.cat = post.category;
        li.innerHTML = `
          <a class="post-link" href="${post.url}" target="_blank" rel="noopener">${post.title}</a>
          <span class="post-meta">
            <span class="post-cat">${post.category}</span>
            <span class="post-date">${post.date}</span>
          </span>
        `;
        list.appendChild(li);
      });
    }

    const filterBar = document.getElementById('filter-bar');
    const categories = ['all', ...new Set(POSTS.map(p => p.category))];
    categories.forEach((cat, i) => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn' + (i === 0 ? ' active' : '');
      btn.dataset.cat = cat;
      btn.textContent = cat;
      filterBar.appendChild(btn);
    });

    renderPosts(POSTS);

    filterBar.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;

      filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const cat = btn.dataset.cat;
      document.querySelectorAll('.post-item').forEach(item => {
        item.classList.toggle('hidden', cat !== 'all' && item.dataset.cat !== cat);
      });
    });
  </script>

  <script src="nav.js"></script>
  <script src="music.js"></script>
</body>
</html>
