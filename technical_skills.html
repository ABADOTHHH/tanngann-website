<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>technical skills // 耽翫</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="pictures/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="pictures/favicon/favicon.ico" sizes="32x32" />
  <link rel="icon" href="pictures/favicon/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="pictures/favicon/apple-touch-icon.png" />
</head>
<body>

  <nav id="nav"></nav>

  <main class="wide">
    <h1>technical skills</h1>
    <div class="skills-wrap">
      <table class="skills-table" id="skills-table">
        <thead>
          <tr id="skills-head"></tr>
        </thead>
        <tbody id="skills-body"></tbody>
      </table>
    </div>
  </main>

  <!--
    To edit this page, only touch the two arrays below.

      LEVELS  = the X axis. Column headers, left to right, weakest to strongest.

      SKILLS  = the Y axis. One entry per line; the table height follows the
                number of lines automatically.
                  { name: 'Thing',  level: 3 }   a skill row, filled up to `level`
                                                 (0 = empty, LEVELS.length = full)
                  { family: 'Name' }            a full-width family heading row
                                                 (the top tier, rendered as ### Name ###)
                  { section: 'Name' }           a full-width section heading row
                                                 (nested inside a family)
  -->
  <script>
    const LEVELS = ["Basic : I've covered it in class", "Rusty : I've used it, I'd need a day to get back up to speed", "Proficient : I can explain this to someone else and troubleshoot it"];

    const SKILLS = [
      { family: 'Cybersecurity' },
      { section: 'Cryptography' },
      { name: 'openssl',            level: 2 },
      { name: 'hashcat',        level: 2 },
      { section: 'Pentest' },
      { name: 'nmap',        level: 2 },
      { name: 'metasploit',              level: 2 },
      { name: 'Burp Suite',                 level: 2 },
      { name: 'ffuf',        level: 2 },
      { name: 'GTFOBins',                 level: 2 },
      { section: 'Reverse engineering' },
      { name: 'IDA',        level: 1 },
      { name: 'x86 ASM',              level: 1 },
      { section: 'Forensic analysis' },
      { name: 'Volatility',         level: 1 },
      { name: 'Autopsy',            level: 2 },
      { name: 'dd',                 level: 2 },
      { name: 'VirusTotal',         level: 2 },
      { section: 'OSINT' },
      { name: 'Shodan',         level: 2 },
      { name: 'Epieos',         level: 2 },
      { name: 'Holehe',         level: 2 },
      { section: 'IAM' },
      { name: 'Kerberos',       level: 1 },
      { name: 'OIDC',           level: 1 },
      { name: 'ZTNA',           level: 1 },

      { family: 'Systems' },
      { section: 'Linux admin' },
      { name: 'GNU core utils',             level: 3 },
      { name: 'Package management (apt, pacman)',        level: 3 },
      { name: 'Daemon management',      level: 3 },
      { name: 'Hardening (SELinux, Lynis)',      level: 2 },
      { name: 'nginx',      level: 2 },
      { section: 'Windows admin' },
      { name: 'Active Directory',             level: 2 },
      { name: 'WSUS',               level: 2 },
      { name: 'IIS',        level: 2 },
      { name: 'RDP',        level: 2 },
      { section: 'Monitoring' },
      { name: 'Zabbix',             level: 2 },
      { name: 'GLPI',               level: 2 },
      { name: 'Splunk',        level: 1 },
      { section: 'Virtualization' },
      { name: 'HyperV',             level: 2 },
      { name: 'VMware',               level: 2 },
      { name: 'Virt-manager (KVM)',        level: 3 },
      { name: 'Docker',      level: 2 },
      { section: 'Programming' },
      { name: 'Python',             level: 2 },
      { name: 'Bash',               level: 1 },
      { name: 'Powershell',        level: 2 },
      { name: 'Webdev (HTML,CSS,JS)',      level: 2 },
      { name: 'VBS',        level: 2 },
      { name: 'PHP',        level: 2 },
      { section: 'Database admin' },
      { name: 'RAID',             level: 2 },
      { name: 'MySQL',             level: 2 },
      { name: 'SQLite',             level: 2 },
      { name: 'SQL',        level: 2 },

      { family: 'Networking' },
      { section: 'Network troubleshooting' },
      { name: 'Wireshark',            level: 2 },
      { name: 'Nmap',              level: 2 },
      { name: 'Dig',          level: 2 },
      { name: 'Netcat',          level: 2 },
      { name: 'Tcpdump',          level: 2 },
      { section: 'Network infrastructure' },
      { name: 'Cisco IOS',            level: 2 },
      { name: 'iptables',              level: 2 },
      { name: 'SOCKS proxy',          level: 1 },
      { name: 'Fortinet',            level: 2 }
    ];

    const head = document.getElementById('skills-head');
    const body = document.getElementById('skills-body');

    head.innerHTML =
      '<th class="skill-name">skill</th>' +
      LEVELS.map((l, i) => `<th>${String(i + 1).padStart(2, '0')} ${l}</th>`).join('');

    body.innerHTML = SKILLS.map(row => {
      if (row.family) {
        return `<tr class="family"><td colspan="${LEVELS.length + 1}">${row.family}</td></tr>`;
      }
      if (row.section) {
        return `<tr class="section"><td colspan="${LEVELS.length + 1}">${row.section}</td></tr>`;
      }
      const cells = LEVELS.map((_, i) => {
        if (i + 1 < row.level)  return '<td class="cell on"></td>';
        if (i + 1 === row.level) return '<td class="cell on peak"></td>';
        return '<td class="cell"></td>';
      }).join('');
      return `<tr><td class="skill-name">${row.name}</td>${cells}</tr>`;
    }).join('');
  </script>

  <script src="nav.js"></script>
  <script src="music.js"></script>
</body>
</html>
